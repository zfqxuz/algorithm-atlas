<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="寻径 · 计算机图谱：一个页面、一个工作台，146 个可交互实验。覆盖算法、数据结构、优化、机器学习、Transformer、操作系统、体系结构、网络、数据库、编译、分布式、安全、图形学与计算理论。">
  <meta name="theme-color" content="#f7f4ed">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>寻径 · 计算机图谱 Algorithm Atlas</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="atlas.css">
  <link rel="stylesheet" href="claude.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="atlas-page">
  <div class="ambient" aria-hidden="true"></div>

  <div class="app-shell atlas-shell">
    <header class="topbar atlas-topbar">
      <a class="brand" href="#atlas" aria-label="寻径计算机图谱首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M7.5 23.5 12.8 10.2l6.1 8.2L24.8 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="7.5" cy="23.5" r="3.1" fill="#07100e" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12.8" cy="10.2" r="2.3" fill="currentColor"/>
            <circle cx="18.9" cy="18.4" r="2.3" fill="currentColor"/>
            <circle cx="24.8" cy="6.5" r="3.1" fill="#07100e" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name">寻径</span>
          <span class="brand-sub">COMPUTER ATLAS</span>
        </span>
      </a>

      <div class="topbar-meta atlas-topbar-meta">
        <a class="atlas-top-link" href="#atlas">实验目录</a>
        <a class="atlas-top-link" href="#atlas">单页工作台</a>
        <span class="global-status" data-tone="idle">
          <span class="status-beacon" aria-hidden="true"></span>
          <span id="appStatus">载入实验目录</span>
        </span>
      </div>
    </header>

    <main id="app" class="ab-main" aria-live="polite"></main>

    <footer class="page-footer atlas-footer">
      <span>ALGORITHM ATLAS / SINGLE-PAGE LAB</span>
      <span class="footer-dot" aria-hidden="true"></span>
      <span>146 个可交互实验 · 一套工作台 · 浏览器本地运行</span>
      <span class="atlas-footer-note">无后端 · 可深链 · 可离线部署</span>
    </footer>
  </div>

  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
